# Copy to config.yaml to override settings (config.yaml is gitignored).
# LLM calls use the OpenAI API (OPENAI_API_KEY in .env).
llm:
  model: gpt-5.6-luna   # OpenAI model for normalize + score
  max_retries: 2
  # call_interval_s: 0.0   # optional fixed pause before each first LLM attempt (rate-limit pacing)

pipeline:
  score_ensemble_n: 3

logging:
  metrics_file: data/results/call_metrics.log